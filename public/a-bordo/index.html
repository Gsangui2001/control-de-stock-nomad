<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102b3c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23102b3c%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2382d8d3%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2215%22%20r%3D%225%22%2F%3E%3Cpath%20d%3D%22M32%2020v32M22%2029h20M12%2035v4a20%2013%200%200%200%2040%200v-4M12%2035l-5%207m5-7%207%204m33-4%205%207m-5-7-7%204%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
    />
    <title>A bordo · Control del barco</title>
    <link rel="stylesheet" href="styles.css?v=barco-2" />
    <link rel="stylesheet" href="daily.css?v=barco-6" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#panel"
          ><span class="brand-mark"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M12 6v15M8 10h8M3 13v2a9 6 0 0 0 18 0v-2M3 13l-2 3m2-3 3 2m15-2 2 3m-2-3-3 2"/></svg></span
          ><span
            ><strong>A bordo</strong><small>Control del barco</small></span
          ></a
        >
        <div class="boat-name" id="boatLabel">Mi barco</div>
        <nav aria-label="Secciones" id="navigation">
          <button data-view="day">← <span>Volver a mi día</span></button>
          <button data-view="panel" class="active">
            ◫ <span>Administrar</span>
          </button>
          <button data-view="manual" class="manual-nav">
            ☰ <span>Manual de instrucciones</span>
          </button>
          <button data-view="stock">▦ <span>Inventario</span></button>
          <button data-view="purchases">
            ＋ <span>Compras y movimientos</span>
          </button>
          <button data-view="cameras" data-private>◉ <span>Cámaras</span></button>
          <button data-view="crew">♙ <span>Tripulación</span></button>
          <button data-view="food">▤ <span>Gastronomía</span></button>
          <button data-view="settings">⚙ <span>Barco y respaldo</span></button>
        </nav>
        <div class="sidebar-foot">
          <span class="dot"></span> Datos guardados en el servidor<small
            >Exportá un respaldo para conservar una copia adicional.</small
          >
        </div>
      </aside>
      <main>
        <header id="dayHeader" class="day-top" hidden></header>
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayLabel"></p>
            <h1 id="viewTitle">Resumen del barco</h1>
          </div>
          <button class="primary" id="quickLog">＋ Registrar trabajo</button>
        </header>
        <div id="notice"></div>
        <section id="content"></section>
        <footer>
          Inventario, mantenimiento e historia del barco en un solo lugar.
        </footer>
      </main>
    </div>
    <dialog id="editor">
      <form id="editorForm">
        <div class="dialog-heading">
          <h2 id="editorTitle"></h2>
          <button
            type="button"
            class="icon-btn"
            id="closeDialog"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>
        <div id="editorFields"></div>
        <p class="form-error" id="formError" role="alert"></p>
        <div class="form-actions">
          <button type="button" class="secondary" id="cancelDialog">
            Cancelar</button
          ><button type="submit" class="primary" id="saveButton">
            Guardar
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="boat-rules.js?v=barco-2"></script>
    <script src="daily.js?v=barco-6"></script>
    <script src="app.js?v=barco-6"></script>
  </body>
</html>
